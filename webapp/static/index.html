<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Сюцай-разбор Ермека Исламовича</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="app"><section class="hero"><div class="badge">Telegram Mini App</div><h1>Сюцай-разбор<br><span id="brand">Ермека Исламовича</span></h1><p>Введите дату рождения и получите описание числа сознания, миссии и денежного ключа.</p></section>
<section class="card"><label>Дата рождения</label><input id="birth" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" maxlength="10"><button id="calc">Получить разбор</button><div id="error"></div></section>
<section id="result" class="result hidden"></section>
<section id="lead" class="card hidden"><h2>Хотите полный разбор?</h2><p>Оставьте главный запрос — я передам его специалисту.</p><textarea id="request" placeholder="Например: хочу понять деньги, отношения, предназначение..."></textarea><button id="sendLead">Оставить заявку</button><a id="consult" class="link" target="_blank">Написать в Telegram</a></section>
</main><script src="/static/script.js"></script></body></html>
